

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Clima Fotografia Page</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Clima Fotografia Page</ion-title>
    </ion-toolbar>
  </ion-header>
  <h1>Ingresa la condición climática:</h1>
  <ion-radio-group value="climas">
    <ion-radio value="Soleado">Soleado</ion-radio>
    <br />
    <ion-radio value="Nublado">Nublado</ion-radio>
    <br />
    <ion-radio value="Lluvioso">Lluvioso</ion-radio>
  </ion-radio-group>
  <h3>Comentario:</h3>
  <br />
  <ion-item>
    <ion-textarea labelPlacement="floating" value="Describe el clima de la fotografía">
      <div slot="label">Comentarios <ion-text color="danger">(Requerido)</ion-text></div>
    </ion-textarea>
  </ion-item>
  <ion-toolbar>
    <ion-title>Toma La Foto</ion-title>
  </ion-toolbar>
  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button>
      <ion-icon :icon="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</ion-content>
